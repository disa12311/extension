<!DOCTYPE html><html lang="vi"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>YouTube Video Fix Pro</title>  <style>    * {      margin: 0;      padding: 0;      box-sizing: border-box;    }        body {      width: 320px;      padding: 16px;      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);      color: white;    }        .header {      text-align: center;      margin-bottom: 20px;    }        .header h1 {      font-size: 20px;      margin-bottom: 4px;    }        .header p {      font-size: 12px;      opacity: 0.9;    }        .section {      background: rgba(255, 255, 255, 0.1);      backdrop-filter: blur(10px);      border-radius: 12px;      padding: 14px;      margin-bottom: 12px;    }        .section-title {      font-size: 13px;      font-weight: 600;      margin-bottom: 10px;      text-transform: uppercase;      letter-spacing: 0.5px;      opacity: 0.9;    }        .option {      display: flex;      justify-content: space-between;      align-items: center;      margin-bottom: 10px;    }        .option:last-child {      margin-bottom: 0;    }        .option label {      font-size: 14px;      cursor: pointer;      flex: 1;    }        .toggle {      position: relative;      width: 44px;      height: 24px;      background: rgba(255, 255, 255, 0.2);      border-radius: 12px;      cursor: pointer;      transition: all 0.3s;    }        .toggle.active {      background: #4CAF50;    }        .toggle::after {      content: '';      position: absolute;      width: 18px;      height: 18px;      background: white;      border-radius: 50%;      top: 3px;      left: 3px;      transition: all 0.3s;    }        .toggle.active::after {      left: 23px;    }        select {      background: rgba(255, 255, 255, 0.2);      color: white;      border: 1px solid rgba(255, 255, 255, 0.3);      border-radius: 6px;      padding: 6px 10px;      font-size: 13px;      cursor: pointer;      outline: none;      width: 100%;      margin-top: 6px;    }        select option {      background: #764ba2;      color: white;    }        .status {      text-align: center;      padding: 12px;      background: rgba(76, 175, 80, 0.2);      border-radius: 8px;      font-size: 13px;      margin-bottom: 12px;      border: 1px solid rgba(76, 175, 80, 0.4);    }        .shortcuts {      background: rgba(255, 255, 255, 0.05);      padding: 10px;      border-radius: 8px;      font-size: 11px;      line-height: 1.6;    }        .shortcuts strong {      color: #FFD700;    }        button {      width: 100%;      padding: 10px;      background: rgba(255, 255, 255, 0.2);      border: 1px solid rgba(255, 255, 255, 0.3);      border-radius: 8px;      color: white;      font-size: 13px;      cursor: pointer;      transition: all 0.3s;      margin-top: 8px;    }        button:hover {      background: rgba(255, 255, 255, 0.3);    }        .footer {      text-align: center;      margin-top: 12px;      font-size: 11px;      opacity: 0.7;    }  </style></head><body>  <div class="header">    <h1>?? YouTube Fix Pro</h1>    <p>T?i uu tr?i nghi?m xem video</p>  </div>  <div class="status">    ? Extension dang ho?t d?ng  </div>  <div class="section">    <div class="section-title">?? Ch?t Lu?ng Video</div>        <div class="option">      <label for="autoQuality">T? d?ng ch?n ch?t lu?ng cao</label>      <div class="toggle active" id="autoQuality"></div>    </div>        <div class="option">      <label for="preferredQuality">Ch?t lu?ng uu tiên:</label>    </div>    <select id="preferredQuality">      <option value="hd2160">4K (2160p)</option>      <option value="hd1440">2K (1440p)</option>      <option value="hd1080" selected>Full HD (1080p)</option>      <option value="hd720">HD (720p)</option>      <option value="large">480p</option>      <option value="medium">360p</option>    </select>        <div class="option" style="margin-top: 10px;">      <label for="forceCodec">Force VP9 codec (ch?t lu?ng t?t hon)</label>      <div class="toggle active" id="forceCodec"></div>    </div>  </div>  <div class="section">    <div class="section-title">? T?i Uu Phát Video</div>        <div class="option">      <label for="bufferFix">Fix l?i buffering/lag</label>      <div class="toggle active" id="bufferFix"></div>    </div>        <div class="option">      <label for="speedControl">Ði?u khi?n t?c d? nâng cao</label>      <div class="toggle active" id="speedControl"></div>    </div>        <div class="option">      <label for="skipAds">T? d?ng skip qu?ng cáo</label>      <div class="toggle active" id="skipAds"></div>    </div>        <div class="option">      <label for="theaterMode">Force Theater Mode</label>      <div class="toggle" id="theaterMode"></div>    </div>        <div class="option">      <label for="disableAutoplay">T?t autoplay</label>      <div class="toggle" id="disableAutoplay"></div>    </div>  </div>  <div class="section">    <div class="section-title">?? Phím T?t</div>    <div class="shortcuts">      <strong>Shift + ></strong> Tang t?c d? (+0.25x)<br>      <strong>Shift + <</strong> Gi?m t?c d? (-0.25x)<br>      <strong>Shift + R</strong> Reset t?c d? (1x)    </div>  </div>  <button id="saveBtn">?? Luu Cài Ð?t</button>  <button id="resetBtn">?? Reset M?c Ð?nh</button>  <div class="footer">    Made with ?? for YouTube lovers  </div>  <script src="popup.js"></script></body></html>
